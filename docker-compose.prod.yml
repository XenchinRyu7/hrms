services:
  postgres:
    image: postgres:16-alpine
    container_name: ethereal_hrms_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-ethereal_hrms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ethereal_hrms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ethereal_hrms_backend_prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:password123@postgres:5432/ethereal_hrms?sslmode=disable}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-for-ethereal-enterprise-hrms-2026}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000,http://localhost:80,http://127.0.0.1:3000}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ethereal_hrms_frontend_prod
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
